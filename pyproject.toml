[project]
name = "llmapigateway"
version = "0.1.0"
description = "LLM Gateway is a gateway to LLM Providers with advanced support fallback in case of failures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.14",
    "httpx[http2]>=0.27.2",
    "python-dotenv>=1.2.2",
    "pydantic>=2.11.10",
    "uvicorn>=0.32.1",
    "python-json-logger>=2.0.7",
    "pydantic-settings>=2.6.1",
    "json5>=0.14.0",
    "python-multipart>=0.0.27",
    "gpt-researcher>=0.14.8",
    "anthropic>=0.84.0",
    "tiktoken>=0.9.0",
    "aiosqlite>=0.20.0",
    "socksio>=1.0.0",
    "nvidia-riva-client>=2.25.1",
    "cloakbrowser>=0.3.25",
    "rs-trafilatura>=0.1.1",
    "youtube-transcript-api>=1.2.4",
    "selectolax>=0.4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.6",
    "playwright>=1.58.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
