<!DOCTYPE html>
<html lang="en" data-i18n-page="overview">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="overview:pageTitle">LLM Gateway - Overview</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/overview.css">
    <link rel="stylesheet" href="/static/shared-nav.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <div class="top-nav">
        <div class="top-nav-content">
            <nav class="gateway-nav-mount" data-gateway-nav hidden></nav>
            <div class="gateway-nav-actions">
                <label class="gateway-locale-label" for="localeSelect" data-i18n="common:languageLabel">Language</label>
                <select id="localeSelect" class="gateway-locale-select" data-locale-select></select>
                <button id="darkModeToggle" type="button" aria-label="Switch to dark mode" data-i18n-aria-label="common:theme.switchToDark" class="theme-toggle">
                    <span class="icon-placeholder"></span>
                </button>
            </div>
        </div>
        <div class="gateway-locale-error" role="alert" data-locale-error hidden></div>
    </div>

    <div class="container">
        <h1 data-i18n="overview:heading">Overview</h1>
        <p data-i18n="overview:intro">A quick snapshot of gateway activity, cost and health.</p>

        <div class="ov-toolbar">
            <div class="ov-field">
                <label for="rangeSelect" data-i18n="overview:filters.range">Range</label>
                <select id="rangeSelect">
                    <option value="24h" data-i18n="overview:filters.rangeOptions.24h">Last 24 hours</option>
                    <option value="7d" selected data-i18n="overview:filters.rangeOptions.7d">Last 7 days</option>
                    <option value="30d" data-i18n="overview:filters.rangeOptions.30d">Last 30 days</option>
                    <option value="90d" data-i18n="overview:filters.rangeOptions.90d">Last 90 days</option>
                </select>
            </div>
            <div class="spacer"></div>
            <button id="refreshBtn" data-i18n="overview:actions.refresh">Refresh</button>
        </div>

        <div id="healthBanner" class="ov-health" data-health-state="loading">
            <span class="ov-health-label" data-i18n="overview:health.label">Gateway status</span>
            <span id="healthStatus" class="ov-health-status">—</span>
            <span id="healthVersion" class="ov-health-version"></span>
        </div>

        <div id="overviewEmpty" class="ov-empty" hidden>
            <strong data-i18n="overview:empty.title">No data yet</strong>
            <span id="overviewEmptyReason" data-i18n="overview:empty.reason">No usage was recorded for the selected range and scope.</span>
        </div>

        <div id="overviewContent">
            <div id="overviewKpis" class="ov-kpis">
                <div class="ov-kpi">
                    <span data-i18n="overview:kpis.requests">Requests</span>
                    <strong id="kpiRequests">—</strong>
                </div>
                <div class="ov-kpi">
                    <span data-i18n="overview:kpis.cost">Cost</span>
                    <strong id="kpiCost">—</strong>
                </div>
                <div class="ov-kpi">
                    <span data-i18n="overview:kpis.p95Latency">P95 latency</span>
                    <strong id="kpiLatency">—</strong>
                </div>
                <div class="ov-kpi">
                    <span data-i18n="overview:kpis.activeRequests">Active requests</span>
                    <strong id="kpiActive">—</strong>
                </div>
                <div class="ov-kpi">
                    <span data-i18n="overview:kpis.errors">Fallback errors</span>
                    <strong id="kpiErrors">—</strong>
                </div>
                <div class="ov-kpi">
                    <span data-i18n="overview:kpis.rejections">Rejections</span>
                    <strong id="kpiRejections">—</strong>
                </div>
            </div>

            <div class="ov-panel">
                <div class="ov-panel-head">
                    <h2 data-i18n="overview:trend.heading">Trend</h2>
                    <div class="ov-field ov-field-inline">
                        <label for="trendMetric" data-i18n="overview:trend.metricLabel">Metric</label>
                        <select id="trendMetric">
                            <option value="requests" data-i18n="overview:trend.metricRequests">Requests</option>
                            <option value="cost" data-i18n="overview:trend.metricCost">Cost</option>
                        </select>
                    </div>
                    <span id="trendMeta"></span>
                </div>
                <div id="trendChart" class="ov-chart"></div>
            </div>

            <div class="ov-panel">
                <div class="ov-panel-head">
                    <h2 data-i18n="overview:topModels.heading">Top models</h2>
                </div>
                <div class="ov-table-wrap">
                    <table class="ov-table">
                        <thead>
                            <tr>
                                <th data-i18n="overview:topModels.columns.model">Model</th>
                                <th data-i18n="overview:topModels.columns.requests">Requests</th>
                                <th data-i18n="overview:topModels.columns.cost">Cost</th>
                            </tr>
                        </thead>
                        <tbody id="topModelsBody">
                            <tr><td colspan="3" class="ov-table-loading" data-i18n="overview:loading">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="messageArea" class="error-banner" hidden></div>
        <pre id="messageDetail" data-i18n-raw-detail hidden></pre>
    </div>

    <script src="/static/vendor/ui-runtime.bundle.js"></script>
    <script src="/static/shared-auth.js"></script>
    <script src="/static/shared-nav.js"></script>
    <script src="/static/overview.js"></script>
</body>
</html>
