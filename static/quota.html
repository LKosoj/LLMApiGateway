<!DOCTYPE html>
<html lang="en" data-i18n-page="quota">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="quota:pageTitle">LLM Gateway - Quota Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/quota.css">
    <link rel="stylesheet" href="/static/shared-nav.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <div class="top-nav">
        <div class="top-nav-content">
            <nav class="gateway-nav-mount" data-gateway-nav hidden></nav>
            <div class="gateway-nav-actions">
                <label class="gateway-locale-label" for="localeSelect" data-i18n="common:languageLabel">Language</label>
                <select id="localeSelect" class="gateway-locale-select" data-locale-select></select>
                <button id="darkModeToggle" type="button" aria-label="Switch to dark mode" data-i18n-aria-label="common:theme.switchToDark" class="theme-toggle">
                    <span class="icon-placeholder"></span>
                </button>
            </div>
        </div>
        <div class="gateway-locale-error" role="alert" data-locale-error hidden></div>
    </div>

    <div class="container">
        <h1 data-i18n="quota:heading">Quota Dashboard</h1>

        <div id="quota-grid" data-quota-state="loading">
            <p class="quota-empty" data-i18n="quota:loading">Loading quota data…</p>
        </div>

        <div class="quota-status-row">
            <div id="quota-status"></div>
            <button id="quota-retry" type="button" class="quota-retry" data-i18n="quota:retry" hidden>Retry</button>
        </div>

        <section id="upstream-quotas-section" class="upstream-quotas-section" style="display:none;">
            <h2 class="upstream-quotas-title" data-i18n="quota:upstreamTitle">Upstream Subscriptions</h2>
            <div id="upstream-quotas-grid"></div>
        </section>
    </div>

    <script src="/static/vendor/ui-runtime.bundle.js"></script>
    <script src="/static/shared-auth.js"></script>
    <script src="/static/shared-nav.js"></script>
    <script src="/static/quota.js"></script>
</body>
</html>
