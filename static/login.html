<!DOCTYPE html>
<html lang="en" data-i18n-page="login">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="auth:pageTitle">LLM Gateway Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 16px;
            box-sizing: border-box;
            font-family: var(--font-sans, "Segoe UI", system-ui, -apple-system, sans-serif);
            color: var(--text, #2e343b);
            background: var(--bg, #f5f6f7);
        }

        .card {
            position: relative;
            width: min(400px, calc(100vw - 32px));
            box-sizing: border-box;
            padding: 28px;
            border-radius: var(--radius-lg, 12px);
            background: var(--bg-elevated, #ffffff);
            border: 1px solid var(--border, #dfe3e8);
            box-shadow: var(--shadow-md);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-strong, #111315);
        }

        p {
            margin: 0 0 20px;
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--text-muted, #5b636e);
        }

        code {
            font-family: var(--font-mono, ui-monospace, Consolas, monospace);
            font-size: 0.85em;
            background: var(--code-bg, #eef0f2);
            color: var(--text-strong, #111315);
            padding: 2px 6px;
            border-radius: var(--radius-sm, 6px);
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-strong, #111315);
        }

        input {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            border: 1px solid var(--border-strong, #c5ccd4);
            border-radius: var(--radius-md, 8px);
            box-sizing: border-box;
            font: inherit;
            font-size: 14px;
            background: var(--bg, #f5f6f7);
            color: var(--text-strong, #111315);
            transition: border-color var(--transition-fast, 140ms ease), box-shadow var(--transition-fast, 140ms ease);
        }

        input:focus,
        input:focus-visible {
            outline: none;
            border-color: var(--accent, #0f766e);
            box-shadow: 0 0 0 3px var(--accent-soft, rgba(15, 118, 110, 0.10));
        }

        button {
            width: 100%;
            height: 40px;
            margin-top: 16px;
            padding: 0 14px;
            border: 1px solid var(--accent, #0f766e);
            border-radius: var(--radius-md, 8px);
            background: var(--accent, #0f766e);
            color: var(--accent-contrast, #ffffff);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: background-color var(--transition-fast, 140ms ease),
                        border-color var(--transition-fast, 140ms ease),
                        transform var(--transition-fast, 140ms ease);
        }

        button:hover:not(:disabled) {
            background: var(--accent-hover, #4338ca);
            box-shadow: var(--shadow-md, 0 4px 12px -2px rgba(15, 23, 42, 0.08));
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: var(--shadow-sm, 0 1px 2px rgba(15, 23, 42, 0.05));
        }

        button:disabled {
            opacity: 0.75;
            cursor: wait;
        }

        .error {
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: var(--radius-md, 10px);
            background: var(--error-soft, #fee2e2);
            border: 1px solid var(--error, #dc2626);
            color: var(--error, #991b1b);
            font-size: 14px;
        }

        #errorBox {
            display: __ERROR_DISPLAY__;
        }

        .hint {
            margin-top: 14px;
            margin-bottom: 0;
            font-size: 13px;
            color: var(--text-muted, #64748b);
        }

        .locale-control {
            display: grid;
            grid-template-columns: auto minmax(112px, 1fr);
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .locale-control label {
            margin: 0;
        }

        .locale-control select {
            width: 100%;
            padding: 9px 30px 9px 10px;
            border: 1px solid var(--border-strong, #cbd5e1);
            border-radius: var(--radius-md, 10px);
            background: var(--bg, #f4f6f9);
            color: var(--text-strong, #0f172a);
            font: inherit;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="locale-control">
            <label for="localeSelect" data-i18n="auth:languageLabel">Language</label>
            <select id="localeSelect" data-locale-select></select>
        </div>
        <div class="error" role="alert" data-locale-error hidden></div>
        <h1 data-i18n="auth:title">Sign in</h1>
        <p data-i18n="auth:intro">Use the master GATEWAY_API_KEY or a virtual lgk_… API key.</p>
        <div id="errorSummary" class="error" hidden></div>
        <template id="serverErrorTemplate">__ERROR_MESSAGE__</template>
        <div id="errorBox" class="error" data-i18n-raw-detail></div>
        <form id="loginForm">
            <input id="nextInput" type="hidden" value="__NEXT__">
            <label for="apiKeyInput" data-i18n="auth:apiKeyLabel">Gateway API key</label>
            <input id="apiKeyInput" name="api_key" type="password" autocomplete="current-password" autofocus required>
            <button id="submitButton" type="submit" data-i18n="auth:submit" disabled>Sign in</button>
        </form>
        <p class="hint" data-i18n="auth:accessHint">The master key opens every administration page. A virtual key opens Docs, Usage Statistics, and Quota for that key.</p>
    </main>
    <script src="/static/vendor/ui-runtime.bundle.js"></script>
    <script src="/static/login.js"></script>
</body>
</html>
