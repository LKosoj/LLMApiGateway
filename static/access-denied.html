<!DOCTYPE html>
<html lang="en" data-i18n-page="access-denied">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="common:access.denied.title">Access restricted</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 16px;
            box-sizing: border-box;
            font-family: var(--font-sans, "Segoe UI", system-ui, -apple-system, sans-serif);
            color: var(--text, #334155);
            background:
                radial-gradient(900px 600px at 85% -10%, var(--accent-soft, rgba(79, 70, 229, 0.11)), transparent 60%),
                radial-gradient(700px 500px at -15% 110%, rgba(100, 116, 139, 0.12), transparent 60%),
                var(--bg, #f4f6f9);
        }

        .card {
            position: relative;
            width: min(420px, calc(100vw - 32px));
            box-sizing: border-box;
            padding: 32px;
            border-radius: var(--radius-xl, 20px);
            background: var(--bg-elevated, #ffffff);
            border: 1px solid var(--border, #e2e8f0);
            box-shadow: var(--shadow-lg, 0 24px 60px rgba(15, 23, 42, 0.18));
            text-align: center;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 24px;
            right: 24px;
            height: 2px;
            border-radius: 0 0 2px 2px;
            background: linear-gradient(90deg, transparent, var(--accent, #4f46e5), transparent);
            opacity: 0.7;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0;
            color: var(--text-strong, #0f172a);
        }

        p {
            margin: 0 0 24px;
            line-height: 1.5;
            color: var(--text, #334155);
        }

        .back-link {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border-radius: var(--radius-md, 10px);
            background: var(--accent, #4f46e5);
            color: var(--accent-contrast, #ffffff);
            font-weight: 700;
            text-decoration: none;
            box-shadow: var(--shadow-sm, 0 1px 2px rgba(15, 23, 42, 0.05));
            transition: background var(--transition-fast, 150ms ease),
                        box-shadow var(--transition-fast, 150ms ease);
        }

        .back-link:hover {
            background: var(--accent-hover, #4338ca);
            box-shadow: var(--shadow-md, 0 4px 12px -2px rgba(15, 23, 42, 0.08));
        }
    </style>
</head>
<body>
    <main class="card">
        <h1 data-i18n="common:access.denied.title">Access restricted</h1>
        <p data-i18n="common:access.denied.body">This section is available to the master API key only.</p>
        <a class="back-link" href="/v1/ui/overview" data-i18n="common:access.denied.back">Back to Overview</a>
    </main>
    <script src="/static/vendor/ui-runtime.bundle.js"></script>
    <script src="/static/access-denied.js"></script>
</body>
</html>
