<!DOCTYPE html>
<html lang="en" data-i18n-page="access-denied">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="common:access.denied.title">Access restricted</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 16px;
            box-sizing: border-box;
            font-family: var(--font-sans, "Segoe UI", system-ui, -apple-system, sans-serif);
            color: var(--text, #2e343b);
            background: var(--bg, #f5f6f7);
        }

        .card {
            position: relative;
            width: min(400px, calc(100vw - 32px));
            box-sizing: border-box;
            padding: 28px;
            border-radius: var(--radius-lg, 12px);
            background: var(--bg-elevated, #ffffff);
            border: 1px solid var(--border, #dfe3e8);
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-strong, #111315);
        }

        p {
            margin: 0 0 24px;
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--text-muted, #5b636e);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 40px;
            box-sizing: border-box;
            padding: 0 14px;
            border-radius: var(--radius-md, 8px);
            background: var(--accent, #0f766e);
            color: var(--accent-contrast, #ffffff);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
            transition: background-color var(--transition-fast, 140ms ease);
        }

        .back-link:hover {
            background: var(--accent-hover, #0d635c);
        }
    </style>
</head>
<body>
    <main class="card">
        <h1 data-i18n="common:access.denied.title">Access restricted</h1>
        <p data-i18n="common:access.denied.body">This section is available to the master API key only.</p>
        <a class="back-link" href="/v1/ui/overview" data-i18n="common:access.denied.back">Back to Overview</a>
    </main>
    <script src="/static/vendor/ui-runtime.bundle.js"></script>
    <script src="/static/access-denied.js"></script>
</body>
</html>
