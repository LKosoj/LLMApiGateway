<!DOCTYPE html>
<html lang="en" data-i18n-page="api-keys">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="api_keys:page.documentTitle">LLM Gateway - API Keys</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/usage-stats.css">
    <link rel="stylesheet" href="/static/api-keys.css">
    <link rel="stylesheet" href="/static/shared-nav.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <div class="top-nav">
        <div class="top-nav-content">
            <nav class="gateway-nav-mount" data-gateway-nav hidden></nav>
            <div class="gateway-nav-actions">
                <label class="gateway-locale-label" for="localeSelect" data-i18n="common:languageLabel">Language</label>
                <select id="localeSelect" class="gateway-locale-select" data-locale-select></select>
                <button id="darkModeToggle" type="button" aria-label="Switch to dark mode" data-i18n-aria-label="common:theme.switchToDark" class="theme-toggle">
                    <span class="icon-placeholder"></span>
                </button>
            </div>
        </div>
        <div class="gateway-locale-error" role="alert" data-locale-error hidden></div>
    </div>

    <div class="container">
        <h1 data-i18n="api_keys:page.heading">LLM Gateway - API Keys</h1>
        <p data-i18n="api_keys:page.description">Manage virtual API keys. Each key may define its own budget (USD), RPM/TPM rate limits, and an optional list of allowed gateway models.</p>

        <div class="keys-toolbar">
            <button id="refreshKeysBtn" data-i18n="api_keys:toolbar.refresh">Refresh</button>
            <button id="createKeyBtn" class="primary" data-i18n="api_keys:toolbar.create">+ Create API Key</button>
        </div>

        <div id="keysArea">
            <p data-i18n="api_keys:table.loading">Loading API keys…</p>
        </div>

        <div id="messageArea"></div>
        <div id="messageDetail" class="message-detail" data-i18n-raw-detail></div>
    </div>

    <div id="keyModal" class="modal-overlay" hidden>
        <div class="modal">
            <h2 id="modalTitle" data-i18n="api_keys:modal.createTitle">Create API Key</h2>
            <div id="newKeyNotice" class="new-key-notice" style="display:none;">
                <strong data-i18n="api_keys:modal.keyNotice.label">API key value</strong>
                <span data-i18n="api_keys:modal.keyNotice.description">— the full value is available to master admins in this modal.</span>
                <div style="margin-top:6px;"><code id="newKeyValue"></code></div>
            </div>
            <div class="modal-field">
                <label for="fieldName" data-i18n="api_keys:modal.fields.name">Name</label>
                <input type="text" id="fieldName" placeholder="e.g. team-backend" data-i18n-placeholder="api_keys:modal.placeholders.name">
            </div>
            <div class="modal-field">
                <label for="fieldBudget"><span data-i18n="api_keys:modal.fields.budget">Budget, USD</span> <span class="hint" data-i18n="api_keys:modal.hints.budget">(leave empty for no limit)</span></label>
                <input type="number" id="fieldBudget" step="0.0001" placeholder="e.g. 10.00" data-i18n-placeholder="api_keys:modal.placeholders.budget">
            </div>
            <div class="modal-field">
                <label for="fieldBudgetPeriod"><span data-i18n="api_keys:modal.fields.budgetPeriod">Budget reset period</span> <span class="hint" data-i18n="api_keys:modal.hints.budgetPeriod">(periodic reset of spent_usd at UTC boundary)</span></label>
                <select id="fieldBudgetPeriod">
                    <option value="none" data-i18n="api_keys:modal.budgetPeriods.none">No reset (cumulative)</option>
                    <option value="daily" data-i18n="api_keys:modal.budgetPeriods.daily">Daily (resets at 00:00 UTC)</option>
                    <option value="monthly" data-i18n="api_keys:modal.budgetPeriods.monthly">Monthly (resets on the 1st, 00:00 UTC)</option>
                </select>
            </div>
            <div class="modal-field" style="display:flex; flex-direction:row; gap:12px;">
                <div style="flex:1;">
                    <label for="fieldRpm" data-i18n="api_keys:modal.fields.rpm">RPM</label>
                    <input type="number" id="fieldRpm" min="0" placeholder="requests/min" data-i18n-placeholder="api_keys:modal.placeholders.rpm">
                </div>
                <div style="flex:1;">
                    <label for="fieldTpm" data-i18n="api_keys:modal.fields.tpm">TPM</label>
                    <input type="number" id="fieldTpm" min="0" placeholder="tokens/min" data-i18n-placeholder="api_keys:modal.placeholders.tpm">
                </div>
            </div>
            <div class="modal-field">
                <label><span data-i18n="api_keys:modal.fields.allowedModels">Allowed Models</span> <span class="hint" data-i18n="api_keys:modal.hints.allowedModels">(leave all unchecked to allow any)</span></label>
                <div id="allowedModelsList" class="allowed-models-list" data-model-catalog-state="idle">
                    <span class="hint" data-i18n="api_keys:modelCatalogLoading">Loading models…</span>
                </div>
            </div>
            <div class="modal-field">
                <label for="fieldMetadata"><span data-i18n="api_keys:modal.fields.metadata">Metadata</span> <span class="hint" data-i18n="api_keys:modal.hints.metadata">(JSON object, optional)</span></label>
                <textarea id="fieldMetadata" placeholder='{"owner": "team-a"}' data-i18n-placeholder="api_keys:modal.placeholders.metadata"></textarea>
            </div>
            <div class="modal-field" id="editOnlyFields" style="display:none;">
                <label style="display:flex; align-items:center; gap:6px; font-weight:normal;">
                    <input type="checkbox" id="fieldDisabled"> <span data-i18n="api_keys:modal.fields.disabled">Disabled</span>
                </label>
                <label style="display:flex; align-items:center; gap:6px; font-weight:normal;">
                    <input type="checkbox" id="fieldResetSpent"> <span data-i18n="api_keys:modal.fields.resetSpent">Reset spent_usd to 0</span>
                </label>
            </div>
            <div class="modal-buttons">
                <button id="cancelKeyBtn" data-i18n="api_keys:modal.actions.close">Close</button>
                <button id="saveKeyBtn" class="primary" data-i18n="api_keys:modal.actions.save">Save</button>
            </div>
        </div>
    </div>

    <script src="/static/vendor/ui-runtime.bundle.js"></script>
    <script src="/static/shared-auth.js"></script>
    <script src="/static/shared-nav.js"></script>
    <script src="/static/api-keys.js"></script>
</body>
</html>
