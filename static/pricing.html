<!DOCTYPE html>
<html lang="en" data-i18n-page="pricing">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pricing:pageTitle">LLM Gateway - Pricing</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/usage-stats.css">
    <link rel="stylesheet" href="/static/pricing.css">
    <link rel="stylesheet" href="/static/shared-nav.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <div class="top-nav">
        <div class="top-nav-content">
            <nav class="gateway-nav-mount" data-gateway-nav hidden></nav>
            <div class="gateway-nav-actions">
                <label class="gateway-locale-label" for="localeSelect" data-i18n="common:languageLabel">Language</label>
                <select id="localeSelect" class="gateway-locale-select" data-locale-select></select>
                <button id="darkModeToggle" type="button" class="theme-toggle">
                    <span class="icon-placeholder"></span>
                </button>
            </div>
        </div>
        <div class="gateway-locale-error" role="alert" data-locale-error hidden></div>
    </div>

    <div class="container">
        <h1><span data-i18n="pricing:heading">LLM Gateway - Pricing</span> <span class="page-version" data-product-version data-i18n-aria-label="pricing:productVersionLabel"></span></h1>

        <!-- Toast notification -->
        <div id="toast" class="pricing-toast"></div>
        <div id="pricingRawDetail" data-i18n-raw-detail></div>

        <!-- Section 1: Editor -->
        <section class="pricing-section">
            <div class="pricing-section-header">
                <h2 data-i18n="pricing:editor.title">Editor</h2>
                <div class="pricing-toolbar-actions">
                    <button id="addRowBtn" type="button" class="secondary-button" data-i18n="pricing:editor.addRow" disabled>Add Row</button>
                    <button id="saveBtn" type="button" class="primary-button" data-i18n="pricing:editor.save" disabled>Save Changes</button>
                </div>
            </div>
            <p class="pricing-hint">
                <span data-i18n="pricing:editor.hintPrefix">Rates are in</span>
                <strong data-i18n="pricing:editor.hintUnit">USD per 1 million tokens</strong><span data-i18n="pricing:editor.hintMiddle">. Changes are written to</span>
                <code data-i18n="pricing:editor.providersFile">providers.json</code><span data-i18n="pricing:editor.hintSuffix"> atomically.</span>
            </p>
            <div
                id="pricingConflictState"
                class="pricing-conflict-state"
                role="alert"
                tabindex="-1"
                hidden
            >
                <h3 id="pricingConflictTitle" data-i18n="pricing:conflict.title"></h3>
                <p id="pricingConflictMessage" data-i18n="pricing:conflict.message"></p>
                <button
                    id="reloadPricingBtn"
                    type="button"
                    class="secondary-button"
                    data-i18n="pricing:conflict.reload"
                ></button>
            </div>
            <div class="pricing-table-wrap">
                <table class="pricing-table" id="pricingTable">
                    <thead>
                        <tr>
                            <th data-i18n="pricing:editor.table.provider">Provider</th>
                            <th data-i18n="pricing:editor.table.model">Model</th>
                            <th data-i18n="pricing:editor.table.inputRate">Input rate ($/1M)</th>
                            <th data-i18n="pricing:editor.table.outputRate">Output rate ($/1M)</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="pricingTableBody">
                    </tbody>
                </table>
                <div id="pricingEmptyState" class="pricing-empty-state" data-i18n="pricing:editor.empty">
                    No pricing configured. Add rows to define per-model rates.
                </div>
            </div>
        </section>

        <!-- Section 2: Calculator -->
        <section class="pricing-section">
            <h2 data-i18n="pricing:calculator.title">Calculator</h2>
            <div class="pricing-calc-grid">
                <div class="pricing-calc-field">
                    <label for="calcModel" data-i18n="pricing:calculator.model">Model</label>
                    <select id="calcModel">
                        <option value="" data-i18n="pricing:calculator.selectModel">— select model —</option>
                    </select>
                </div>
                <div class="pricing-calc-field">
                    <label for="calcPromptTokens" data-i18n="pricing:calculator.promptTokens">Prompt tokens</label>
                    <input type="number" id="calcPromptTokens" min="0" value="1000000" />
                </div>
                <div class="pricing-calc-field">
                    <label for="calcCompletionTokens" data-i18n="pricing:calculator.completionTokens">Completion tokens</label>
                    <input type="number" id="calcCompletionTokens" min="0" value="500000" />
                </div>
                <div class="pricing-calc-field pricing-calc-action">
                    <button id="calcBtn" type="button" class="primary-button" data-i18n="pricing:calculator.calculate">Calculate</button>
                </div>
            </div>
            <div id="calcResult" class="pricing-calc-result" hidden>
                <span id="calcCostValue" class="cost-value"></span>
                <span class="rates-info">
                    <span data-i18n="pricing:calculator.result.model">Model:</span>
                    <strong id="calcModelValue"></strong>
                    <span aria-hidden="true"> | </span>
                    <span data-i18n="pricing:calculator.result.input">Input:</span>
                    <strong id="calcInputRateValue"></strong>
                    <span aria-hidden="true"> | </span>
                    <span data-i18n="pricing:calculator.result.output">Output:</span>
                    <strong id="calcOutputRateValue"></strong>
                </span>
            </div>
        </section>
    </div>

    <div id="pricingDetailSheet" class="pricing-sheet" hidden>
        <div id="pricingDetailBackdrop" class="pricing-sheet-backdrop"></div>
        <div class="pricing-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="pricingDetailTitle">
            <div class="pricing-sheet-head">
                <h2 id="pricingDetailTitle" data-i18n="pricing:detail.heading">Row details</h2>
                <button id="pricingDetailClose" type="button" aria-label="Close" data-i18n-aria-label="pricing:detail.close">&times;</button>
            </div>
            <div class="pricing-sheet-row">
                <span data-i18n="pricing:editor.table.provider">Provider</span>
                <strong id="pricingDetailProvider"></strong>
            </div>
            <div class="pricing-sheet-row">
                <span data-i18n="pricing:editor.table.model">Model</span>
                <strong id="pricingDetailModel"></strong>
            </div>
            <div class="pricing-sheet-field">
                <label for="pricingDetailInputRate" data-i18n="pricing:editor.table.inputRate">Input rate ($/1M)</label>
                <input type="number" id="pricingDetailInputRate" min="0" step="any">
            </div>
            <div class="pricing-sheet-field">
                <label for="pricingDetailOutputRate" data-i18n="pricing:editor.table.outputRate">Output rate ($/1M)</label>
                <input type="number" id="pricingDetailOutputRate" min="0" step="any">
            </div>
        </div>
    </div>

    <script src="/static/vendor/ui-runtime.bundle.js"></script>
    <script src="/static/shared-auth.js"></script>
    <script src="/static/shared-nav.js"></script>
    <script src="/static/pricing.js"></script>
</body>
</html>
