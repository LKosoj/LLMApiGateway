<!DOCTYPE html>
<html lang="en" data-i18n-page="translator">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="translator:pageTitle">LLM Gateway - Translator Check</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/translator-debug.css">
    <link rel="stylesheet" href="/static/shared-nav.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <div class="top-nav">
        <div class="top-nav-content">
            <nav class="gateway-nav-mount" data-gateway-nav hidden></nav>
            <div class="gateway-nav-actions">
                <label class="gateway-locale-label" for="localeSelect" data-i18n="common:languageLabel">Language</label>
                <select id="localeSelect" class="gateway-locale-select" data-locale-select></select>
                <button id="darkModeToggle" type="button" aria-label="Switch to dark mode" data-i18n-aria-label="common:theme.switchToDark" class="theme-toggle">
                    <span class="icon-placeholder"></span>
                </button>
            </div>
        </div>
        <div class="gateway-locale-error" role="alert" data-locale-error hidden></div>
    </div>

    <div class="container">
        <h1 data-i18n="translator:heading">Translator Check</h1>
        <p data-i18n="translator:intro" style="margin-top:-12px; margin-bottom:24px; font-size:0.9rem; color:var(--text-muted);">Inspect how the gateway transforms requests between OpenAI and Anthropic formats. Master-only tool — no real provider call is made.</p>

        <div class="layout-columns">
            <!-- ── Left panel: input ── -->
            <div class="panel">
                <h2 data-i18n="translator:input.title">Input</h2>

                <label for="sourceFormat" data-i18n="translator:input.sourceFormat">Source format</label>
                <select id="sourceFormat">
                    <option value="openai">OpenAI</option>
                    <option value="anthropic">Anthropic</option>
                </select>

                <label for="targetFormat" data-i18n="translator:input.targetFormat">Target format</label>
                <select id="targetFormat">
                    <option value="anthropic">Anthropic</option>
                    <option value="openai">OpenAI</option>
                </select>

                <label for="requestInput" data-i18n="translator:input.requestBody">Request body (JSON)</label>
                <textarea id="requestInput" rows="14" spellcheck="false" placeholder='{"model":"gpt-4o","messages":[{"role":"user","content":"Hello"}]}'></textarea>

                <label for="mockResponse" style="margin-top:10px;">
                    <span data-i18n="translator:input.mockResponse">Mock provider response (JSON, optional)</span>
                    <span data-i18n="translator:input.mockHint" style="font-weight:400;">— leave blank for default mock</span>
                </label>
                <textarea id="mockResponse" rows="6" spellcheck="false" placeholder='Leave blank to use the built-in mock response' data-i18n-placeholder="translator:input.mockPlaceholder"></textarea>

                <div class="btn-row">
                    <button id="runBtn" type="button" class="btn-primary" data-i18n="translator:actions.run">
                        Run translation
                    </button>
                    <button id="openaiSampleBtn" type="button" class="btn-secondary" data-i18n="translator:actions.openaiSample">OpenAI sample</button>
                    <button id="anthropicSampleBtn" type="button" class="btn-secondary" data-i18n="translator:actions.anthropicSample">Anthropic sample</button>
                    <button id="toolSampleBtn" type="button" class="btn-secondary" data-i18n="translator:actions.toolSample">Tool-use sample</button>
                </div>
            </div>

            <!-- ── Right panel: output steps ── -->
            <div class="panel">
                <h2 data-i18n="translator:steps.title">Translation Steps</h2>
                <div id="errorBanner" class="error-banner"></div>
                <div id="errorDetail" data-i18n-raw-detail hidden></div>
                <div id="stepsContainer">
                    <p style="font-size:0.85rem;">
                        <span data-i18n="translator:steps.emptyBefore">Fill in the input and click</span>
                        <strong data-i18n="translator:actions.run">Run translation</strong>
                        <span data-i18n="translator:steps.emptyAfter">to see the pipeline steps.</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/vendor/ui-runtime.bundle.js"></script>
    <script src="/static/shared-auth.js"></script>
    <script src="/static/shared-nav.js"></script>
    <script src="/static/translator-debug.js"></script>
</body>
</html>
